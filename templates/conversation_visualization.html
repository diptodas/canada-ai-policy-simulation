<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canadian AI policy simulation</title>
<style>
:root{--talk:#00a800;--conversation:#00aeb8;--reach:#7b2b83;--ink:#302b28;--muted:#756b64;--paper:#fff;--wash:#f7f2eb;--line:#ded5ca}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:14px/1.45 system-ui,sans-serif;background:var(--wash)}.app{display:grid;grid-template-columns:minmax(250px,25%) 1fr;min-height:100vh}.sidebar{padding:22px 18px;background:#fff;border-right:1px solid var(--line);overflow:auto}.main{min-width:0;padding:22px 28px;background:linear-gradient(145deg,#fffaf1,#f4fbff)}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{margin:5px 0 18px;font-size:20px;line-height:1.2}label{display:block;margin:16px 0 5px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--reach)}select{width:100%;padding:9px 10px;border:1px solid #c9c0b7;border-radius:8px;background:#fff;color:var(--ink);font-weight:700}.preset{margin-top:16px;padding:10px;border-left:4px solid var(--reach);background:#faf6fb}.preset b{display:block}.policy{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.policy h2{margin:0 0 8px;font-size:16px}.policy-text{white-space:pre-wrap;color:#514944}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:18px}.fact{padding:8px;border:1px solid var(--line);border-radius:8px;background:#fcfbf9;font-size:10px;color:var(--muted)}.fact b{display:block;color:var(--reach);font-size:14px}.diagnostics{margin-top:10px;font-size:10px;color:var(--muted)}.network-panel{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.network-panel h3{margin:3px 0 8px;font-size:13px}.network-canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;border:1px solid var(--line);border-radius:9px;background:#fbfaf8}.network-key{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:9px;color:var(--muted)}.network-key i{display:inline-block;width:9px;height:9px;margin-right:3px;border-radius:50%;vertical-align:-1px}.network-caption{min-height:16px;margin-top:5px;font-size:10px;color:var(--muted)}.stage{max-width:1100px;margin:auto;text-align:center}.stage-title{font-size:22px;font-weight:800}.meta{min-height:21px;margin:4px;color:var(--muted)}.progress{height:5px;max-width:780px;margin:10px auto 18px;background:#e2ddd7;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--talk),var(--conversation));transition:width .25s}.reply{display:none;max-width:760px;margin:0 auto 9px;padding:10px 14px;border:2px solid var(--conversation);border-radius:14px;background:#eaffff;text-align:left;font-size:12px}.speech{min-height:92px;max-width:800px;margin:0 auto 16px;padding:18px 20px;border:3px solid var(--talk);border-radius:22px;background:#f3fff3;text-align:left;font-size:16px;box-shadow:0 6px 20px #0002}.speech.pulse{animation:pop .3s ease-out}.invoked{max-width:800px;margin:-7px auto 14px;color:var(--reach);font-size:11px}.invoked span{display:inline-block;margin:2px 3px;padding:3px 7px;border:1px solid var(--reach);border-radius:12px;background:#f6eaf8}.people{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px;align-items:stretch;min-height:335px}.person{position:relative;padding:12px 8px;border:3px solid transparent;border-radius:17px;background:#ffffffa8;transition:.2s}.person.speaker{border-color:var(--talk);background:#eaffea;transform:translateY(-4px)}.person.target{border-color:var(--conversation);background:#eaffff}.person:not(.speaker):not(.target){opacity:.72}.icon{display:block;font-size:52px}.speaker .icon{animation:bob .8s ease-in-out infinite alternate}.role{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--muted)}.speaker .role{color:#007600}.target .role{color:#007b82}.name{font-size:12px;font-weight:800}.awareness{margin-top:8px;text-align:left;font-size:9px;color:#625961}.awareness b{display:block;margin-bottom:3px;color:var(--reach);text-transform:uppercase;letter-spacing:.06em}.awareness span{display:block;margin:3px 0;padding:3px 5px;border-left:2px solid #b88abf;background:#faf3fb}.tip{display:none;position:absolute;z-index:20;bottom:98%;left:50%;transform:translateX(-50%);width:260px;max-height:320px;overflow:auto;padding:11px;border-radius:9px;background:#27221f;color:#fff;text-align:left;font-size:11px;box-shadow:0 6px 20px #0005}.person:hover{opacity:1}.person:hover .tip{display:block}.controls{display:grid;grid-template-columns:46px 96px 46px minmax(150px,1fr) 74px;gap:8px;align-items:center;max-width:800px;margin:20px auto 0}.controls button{height:38px;border:1px solid #c9c0b7;border-radius:8px;background:#fff;cursor:pointer;font-weight:750}.controls input{width:100%}.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}.hint{margin-top:8px;color:var(--muted);font-size:10px}@keyframes bob{to{transform:translateY(-5px) rotate(2deg)}}@keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:scale(1);opacity:1}}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line)}.main{padding:18px}.people{grid-template-columns:repeat(2,minmax(130px,1fr))}}@media(max-width:520px){.people{grid-template-columns:1fr 1fr}.controls{grid-template-columns:42px 88px 42px}.controls input,.count{grid-column:1/-1}.speech{font-size:14px}}
.main{height:auto;min-height:100vh;overflow:visible}.stage{height:100%;min-height:100vh;display:flex;flex-direction:column}.reply{display:block!important;flex:0 0 44px;width:min(760px,100%);height:44px;margin:0 auto 8px;overflow:auto}.reply:empty{visibility:hidden}.speech{position:static;flex:0 0 124px;width:min(800px,100%);height:124px;min-height:124px;margin:0 auto 8px;padding-bottom:22px;overflow:auto}.invoked{flex:0 0 34px;width:min(800px,100%);height:34px;margin:0 auto 8px;overflow:auto}.people{grid-template-columns:repeat(3,minmax(130px,1fr));grid-template-rows:repeat(2,minmax(250px,1fr));flex:1 0 520px;height:auto;min-height:520px;overflow:visible;align-content:stretch}.person{height:auto;min-height:250px;overflow:visible}.person:hover{z-index:50}.awareness{max-height:158px;overflow:auto}.tip{z-index:100}.controls{position:static;flex:0 0 auto;margin:14px auto 0}.hint{position:static;flex:0 0 auto}@media(max-width:850px){.stage{height:auto;min-height:0}.people{grid-template-columns:repeat(2,minmax(130px,1fr));grid-template-rows:repeat(3,minmax(250px,auto));min-height:774px}}
</style>
<div class="app">
  <aside class="sidebar">
    <div class="eyebrow">Simulation controls</div>
    <h1>Canadian AI policy discussion</h1>
    <label for="policy-select">Policy announcement</label>
    <select id="policy-select"></select>
    <label for="preset-select">Network preset</label>
    <select id="preset-select"></select>
    <div class="preset"><span class="eyebrow">Active network preset</span><b id="preset"></b></div>
    <section class="policy"><h2 id="policy-title"></h2><div class="policy-text" id="policy-text"></div></section>
    <div class="facts" id="facts"></div>
    <div class="diagnostics" id="diagnostics"></div>
    <section class="network-panel">
      <div class="eyebrow">Social structure</div>
      <h3>Network map</h3>
      <canvas class="network-canvas" id="network-map" width="640" height="480"></canvas>
      <div class="network-key"><span><i style="background:var(--talk)"></i>Speaker</span><span><i style="background:var(--conversation)"></i>Listener</span><span>Node size = betweenness</span></div>
      <div class="network-caption" id="network-caption"></div>
    </section>
  </aside>
  <main class="main">
    <div class="stage">
      <div class="eyebrow">Conversation</div>
      <div class="stage-title" id="conversation-title"></div>
      <div class="meta" id="meta"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="reply" id="reply"></div>
      <div class="speech" id="speech"></div>
      <div class="invoked" id="invoked"></div>
      <div class="people" id="people"></div>
      <div class="controls">
        <button id="prev" title="Previous message">◀</button>
        <button id="play">▶ Play</button>
        <button id="next" title="Next message">▶</button>
        <input id="timeline" type="range" min="0" value="0" aria-label="Conversation timeline">
        <span class="count" id="count"></span>
      </div>
      <div class="hint">Hover over an agent for their complete profile · use ← and → to navigate</div>
    </div>
  </main>
</div>
<script src="../available_presets.js"></script>
<script>
const data=__PAYLOAD__;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const policies=[...new Map(data.events.map(e=>[e.policy_id,{id:e.policy_id,title:e.policy_title,text:e.policy_text}])).values()];
let policyId=policies[0]?.id||'',events=[],index=0,timer=null,recent=[];
const $=id=>document.getElementById(id);
const availablePresets=window.AVAILABLE_PRESETS?.length?window.AVAILABLE_PRESETS:(data.available_presets?.length?data.available_presets:[{id:data.network_preset,label:data.network_preset_label,url:location.href}]);
function profile(name){const p=data.profiles[name]||{};return '<b>'+esc(name)+'</b><br>'+Object.entries(p).filter(([k])=>k!=='profile_id').map(([k,v])=>esc(k.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()))+': '+esc(v)).join('<br>')}
function avatar(name){const p=data.profiles[name]||{},race=p.race_ethnicity||'',gender=String(p.gender||'').toLowerCase(),tone=race==='Black'?'🏿':['South Asian','Indigenous','Filipino','Arab','Latin American'].includes(race)?'🏽':['White','Chinese'].includes(race)?'🏻':'';return (gender.includes('woman')||gender.includes('female')?'👩':gender.includes('man')||gender.includes('male')?'👨':'🧑')+tone}
function awareness(name){return (data.strategic_awareness[name]||[]).map(x=>'<span>'+esc(x)+'</span>').join('')}
function communityColor(value){let hash=0;for(const c of value)hash=(hash*31+c.charCodeAt(0))>>>0;return `hsl(${hash%360} 55% 52%)`}
function networkData(){let edges=(data.network_edges||[]).map(e=>({...e}));if(!edges.length)edges=(data.social_edges||[]).map(e=>({source:e[0],target:e[1],strength:'weak'}));let nodes=(data.network_nodes||[]).map(n=>({...n}));if(!nodes.length){const names=[...new Set([...(data.names||[]),...edges.flatMap(e=>[e.source,e.target])])],degree=Object.fromEntries(names.map(n=>[n,0]));edges.forEach(e=>{degree[e.source]=(degree[e.source]||0)+1;degree[e.target]=(degree[e.target]||0)+1});nodes=names.sort().map((name,i)=>{const p=data.profiles?.[name]||{},angle=2*Math.PI*i/Math.max(1,names.length),radius=.72+.22*((i%7)/6);return{name,x:Math.cos(angle)*radius,y:Math.sin(angle)*radius,community:[p.urbanicity,p.mother_tongue].filter(Boolean).join(' / ')||'community',degree:degree[name]||0,betweenness:0}})}return{nodes,edges}}
function drawNetwork(speaker='',listener=''){const canvas=$('network-map'),ctx=canvas.getContext('2d'),network=networkData(),nodes=network.nodes,edges=network.edges,byName=Object.fromEntries(nodes.map(n=>[n.name,n]));ctx.clearRect(0,0,canvas.width,canvas.height);if(!nodes.length){$('network-caption').textContent='No network data available.';return}const xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=24,px=n=>pad+(n.x-minX)/(maxX-minX||1)*(canvas.width-2*pad),py=n=>pad+(n.y-minY)/(maxY-minY||1)*(canvas.height-2*pad);for(const e of edges){const a=byName[e.source],b=byName[e.target];if(!a||!b)continue;ctx.beginPath();ctx.moveTo(px(a),py(a));ctx.lineTo(px(b),py(b));ctx.strokeStyle=e.strength==='strong'?'rgba(123,43,131,.24)':'rgba(80,75,70,.10)';ctx.lineWidth=e.strength==='strong'?1.5:.7;ctx.stroke()}for(const n of nodes){const active=n.name===speaker,target=n.name===listener,r=Math.min(11,2.4+(n.betweenness?Math.sqrt(Math.max(0,n.betweenness))*18:Math.sqrt(Math.max(1,n.degree||1))*.55));ctx.beginPath();ctx.arc(px(n),py(n),active||target?r+3:r,0,Math.PI*2);ctx.fillStyle=active?'#00a800':target?'#00aeb8':communityColor(n.community);ctx.fill();if(active||target){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}}$('network-caption').textContent=speaker?(listener?speaker+' → '+listener:speaker+' gives an independent reaction'):'Communities are colored; stronger ties are darker.'}
function setPolicy(id){policyId=id;events=data.events.filter(e=>e.policy_id===id);index=0;recent=[];const p=policies.find(x=>x.id===id);$('policy-title').textContent=p?.title||'';$('policy-text').textContent=p?.text||'';$('timeline').max=Math.max(0,events.length-1);$('timeline').value=0;stop();render()}
function render(){if(!events.length){$('speech').textContent='No TALK events are available for this policy.';drawNetwork();return}const e=events[index],candidates=[e.agent_name,e.target,...recent.slice().reverse(),...data.names],visible=[];for(const n of candidates){if(n&&!visible.includes(n))visible.push(n);if(visible.length===Math.min(6,data.names.length))break}recent.push(e.agent_name);if(recent.length>8)recent.shift();$('conversation-title').textContent=e.policy_title;$('meta').textContent='Round '+e.round+' · '+(e.target?e.agent_name+' → '+e.target:'independent reaction by '+e.agent_name);$('reply').style.display=e.reply_to_statement?'block':'none';$('reply').innerHTML=e.reply_to_statement?'↩ <b>Responding to '+esc(e.target)+':</b> “'+esc(e.reply_to_statement)+'”':'';$('speech').innerHTML='💬 <b>'+esc(e.agent_name)+'</b><br>'+esc(e.response);$('speech').classList.remove('pulse');void $('speech').offsetWidth;$('speech').classList.add('pulse');const invoked=e.invoked_challenges||[];$('invoked').innerHTML=invoked.length?'<b>Possible strategic context invoked:</b> '+invoked.map(x=>'<span>'+esc(x)+'</span>').join(''):'No clear strategic-context signal in this response';$('people').innerHTML=visible.map(n=>'<div class="person '+(n===e.agent_name?'speaker':n===e.target?'target':'')+'"><span class="icon">'+avatar(n)+'</span><div class="role">'+(n===e.agent_name?'SPEAKING':n===e.target?'LISTENING':'IN THE GROUP')+'</div><div class="name">'+esc(n)+'</div><div class="awareness"><b>Known challenges</b>'+awareness(n)+'</div><div class="tip">'+profile(n)+'</div></div>').join('');drawNetwork(e.agent_name,e.target);$('bar').style.width=((index+1)/events.length*100)+'%';$('timeline').value=index;$('count').textContent=(index+1)+' / '+events.length}
function stop(){if(timer){clearInterval(timer);timer=null}$('play').textContent='▶ Play'}
$('policy-select').innerHTML=policies.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title)+'</option>').join('');
$('policy-select').onchange=e=>setPolicy(e.target.value);
$('preset-select').innerHTML=availablePresets.map(p=>'<option value="'+esc(p.url)+'"'+(p.id===data.network_preset?' selected':'')+'>'+esc(p.label)+' ('+esc(p.id)+')</option>').join('');
$('preset-select').onchange=e=>{if(e.target.value)location.href=e.target.value};
$('prev').onclick=()=>{index=(index-1+events.length)%events.length;render()};
$('next').onclick=()=>{index=(index+1)%events.length;render()};
$('play').onclick=()=>{if(timer){stop()}else{timer=setInterval(()=>{index=(index+1)%events.length;render()},2200);$('play').textContent='❚❚ Pause'}};
$('timeline').oninput=()=>{index=+$('timeline').value;render()};
document.onkeydown=e=>{if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();if(e.key===' ')$('play').click()};
$('preset').textContent=data.network_preset_label+' ('+data.network_preset+')';
const n=data.network,d=data.network_diagnostics;$('facts').innerHTML=[['Participants',n.participants],['Relationships',n.relationships],['Average contacts',n.average_contacts],['Density',n.density]].map(([k,v])=>'<div class="fact"><b>'+esc(v)+'</b>'+esc(k)+'</div>').join('');$('diagnostics').textContent='Clustering '+d.average_clustering+' · average path '+d.average_path_length+' · modularity '+d.community_modularity+' · language assortativity '+d.language_assortativity+' · strongest bridge '+d.highest_betweenness_agent;
setPolicy(policyId);
</script>
